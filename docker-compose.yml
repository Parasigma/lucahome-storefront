services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rapidtax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: rapidtax
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidtax"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rapidtax:${POSTGRES_PASSWORD}@db:5432/rapidtax?schema=public
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
volumes:
  pgdata:
  uploads:
